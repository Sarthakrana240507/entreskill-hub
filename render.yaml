# Render Blueprint — defines the backend web service and managed Postgres
# database together so `render.yaml` can deploy both with one click.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: entreskill-hub-db
    plan: free
    databaseName: entreskill_hub
    user: entreskill_hub_user

services:
  - type: web
    name: entreskill-hub-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: entreskill-hub-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # set this manually to your deployed frontend URL after first deploy
